<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gallery</title>

  <!-- Tailwind CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primaryDark: '#0b1d33'
          }
        }
      }
    }
  </script>

  <style>
     body {
    opacity: 0;
    animation: fadeIn 2s ease-out forwards;
  }

  @keyframes fadeIn {
    to {
      opacity: 1;
    }
  }
  </style>
</head>

<body class="bg-primaryDark text-white">

  <div class="max-w-7xl mx-auto px-4 py-12">

    <!-- PAGE TITLE -->
    <div class="mb-12 text-center">
      <h1 class="text-4xl md:text-4xl font-bold">Welcome To Our Sports Gallery</h1>
      <p class="text-gray-300 mt-3">
        Explore moments across different categories
      </p>
    </div>

    <!-- CATEGORY: SPORTS -->
    <section class="mb-16">
      <h2 class="text-3xl font-semibold mb-6 text-center">Sports</h2>

      <div class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-4">
        <img src="thumbnails/andalogo.jpg" class="gallery-img">
        <img src="thumbnails/sports.jpg" class="gallery-img">
        <img src="thumbnails/tours.jpeg" class="gallery-img">
         <img src="thumbnails/tours.jpeg" class="gallery-img">
         <img src="thumbnails/andalogo.jpg" class="gallery-img">
        <img src="thumbnails/sports.jpg" class="gallery-img">
        <img src="thumbnails/tours.jpeg" class="gallery-img">
         <img src="thumbnails/tours.jpeg" class="gallery-img">
         <img src="thumbnails/andalogo.jpg" class="gallery-img">
        <img src="thumbnails/sports.jpg" class="gallery-img">
        <img src="thumbnails/tours.jpeg" class="gallery-img">
         <img src="thumbnails/tours.jpeg" class="gallery-img">
         <img src="thumbnails/andalogo.jpg" class="gallery-img">
        <img src="thumbnails/sports.jpg" class="gallery-img">
        <img src="thumbnails/tours.jpeg" class="gallery-img">
         <img src="thumbnails/tours.jpeg" class="gallery-img">
      </div>
    </section>

   
  </div>

  <!-- IMAGE STYLING -->
  <style>
    .gallery-img {
      width: 100%;
      aspect-ratio: 1 / 1;
      object-fit: cover;
      border-radius: 0.75rem;
      cursor: pointer;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .gallery-img:hover {
      transform: scale(1.03);
      box-shadow: 0 10px 30px rgba(0,0,0,0.4);
    }
  </style>

</body>
</html>
